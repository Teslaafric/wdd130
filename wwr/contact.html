<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rapids - Contact Us </title>
  <meta name="description" content="Find out more information on the Rapids and our amazing staffs, fill out the survey">
  <meta name="author" content="Solomon Obi">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img id="logo" src="images/therapids.jpg" alt="Company Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact us</a>
    </nav>
  </header>
  <main>
    <div class="contact">
      <h1>The Rapids</h1>
      <p>16 Wike Street Maitama, Abuja </p>
      <p>(+234) 7055522267</p>
      <p>Info@rapidswaterraft.com</p>
    </div>
    <div class="details">
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d126074.04967516485!2d7.431666512301434!3d9.080698080289599!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1759436420589!5m2!1sen!2sng" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div>
         <form>
          <div class="text-input-container">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your name">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="@.com">
          </div>
            
            <div class="purpose-container">
              <p>Message Purpose</p>
              <div class="choice">
              <input type="radio" id="services" name="inquiry">
              <label for="services">Services Inquiry</label>
              <input type="radio" id="reservation" name="inquiry">
              <label for="reservation">Reservation Process</label>
              <input type="radio" id="support" name="inquiry">
              <label for="support">Suggestion Box</label>
              </div>
            </div>

            <div class="text-message">
            <label for="message">Message:</label>
            <textarea rows="4" id="message" name="message" placeholder="Type here"></textarea>
            </div>
            <div class="subscribe">
            <input type="checkbox" id="subscribe" name="subscribe">
            <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
            </div>
            <button type="submit">Send in your Response </button>
          </form>
        </div>
    </div>
    <div class="records">
       <h2>
        We Are Here to Serve You
      </h2>
      <figure>
        <img src="images/staff-1.jpg" alt="Group of people rafting on a river">
        <figcaption>Kimberly the company's lead. She has been behind our success</figcaption>
      </figure>
      <figure> 
        <img src="images/staff-2.jpg" alt="Group of rafters synchronizing their paddling strokes in a moving raft on the river">
        <figcaption>Isowo safety and planning specialist</figcaption>
      </figure>
      <figure>
        <img src="images/staff-3.jpg" alt="Empty rafting boat on the riverbank">
        <figcaption>Jessy is the team lead, keeping every trip fun filled and memorable</figcaption>
      </figure>

    </div>
  </main>
  <footer>
    <p>
      &copy;2025 🔷 The Rapids 🔷 Solomon Obi
    </p>
    <nav class="socialmedia">
      <a href="https://www.linkedin.com">
        <img class="socialmedia-icon" src="images/linkedin.png" alt="Linkedin Icon">
      </a>
      <a href="https://www.youtube.com">
        <img class="socialmedia-icon" src="images/youtube.png" alt="Youtube Icon">
      </a>
      <a href="https://www.instagram.com">
        <img class="socialmedia-icon" src="images/instagram.jpg" alt="Instagram Icon">
      </a>
    </nav>
  </footer>
</body>

</html>
