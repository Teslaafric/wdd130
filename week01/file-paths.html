<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Path Activity</title>
</head>

<body>
    <h1>File Path Activity</h1>
    <p>Fix the image tags below so that they each display the correct image.</p>
    <!--The dot notation took me to the subfolder inside the same root folder-->
    <p>A temple image file in the images subfolder:</p>
    <img src="./images/aba-nigeria-temple.jpeg" alt="The Aba Nigeria Temple">
    <!--Double dot notation took me out to the main parent folder-->
    <p>A temple image file in the root images folder:</p>
    <img src="../images/salt-lake-temple.jpg" alt="The Salt Lake Temple">
    <!--https:// was added and the address for an external url-->
    <p>A temple image file with an absolute path:</p>
    <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/anchorage-alaska/320x180/anchorage-temple-lds-253274-wallpaper.jpg"
        alt="The Anchorage Alaska Temple">

</body>

</html>
