<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>quiz form</title>
  </head>
  <body>
    <header>
      <h1>
        HTML and CSS Quiz Form 2025
      </h1>
    </header>
    <main>
      <form>
      <p>1. <label for="q1">Which of these is not part of a HTML structure?
        </label></p>
        <select id="q1" name="q1">
        <option value="" selected disabled>Choose one</option>
        <option value="doctype">!Doctype</option>
        <option value="header">Header</option>
        <option value="body">Body</option>
        <option value="head">Head</option>
        </select>
      
        <p>2. <label for="q2">Explain the functions of HTML and CSS?</label></p>
        <textarea id="q2" name="q2" rows="5"></textarea>
      
    
  
  
        <p>3. <label for="q3">What is the benefit of comment?</label></p>
        <input type="text" id="q3" name="q3">
    
    
    
        <p>4. <label for="q4">What is the RGB representation of white 255 255 and ?</label></p>
        <input type="number" id="q4" name="q4">
    
  
        <button type="submit">Submit Quiz</button>

      </form>
    
    </main>
    <footer></footer>
  </body>
</html>
