<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>User Poll</title>
  </head>
  <body>
    <header>
      <h1>
        WDD 130 | HTML Form - User Poll 
      </h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>
            Contact Information
          </legend>
            <div class="form-item column2">
            <label for="fname">Full name:</label>
            <input type="text" id="fname" name="user-name">
          </div>
          <div class="form-item column2">
            <label for="useremail">Email:</label>
            <input type="text" id="useremail" name="useremail">
          </div>
        </fieldset>
        <fieldset>
          <legend>
            Questions
          </legend>
          <div class="form-item column1">
            <label for="browser">What is your favourite internet browser?</label>
            <select id="browser" name="browser">
              <option value="" selected>Choose option</option>
              <option value="chrome">Google chrome</option>
              <option value="edge">Microsoft edge</option>
              <option value="firefox">Mozila firefox</option>
              <option value="safari">Safari</option>
            </select>
          </div>
          <div class="form-item column1">
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
          </div>
            <label for="feedback">List the places you have lived:</label>
           <textarea  id="feedback" name="feedback" rows="4" placeholder="Kubwa, Gwarinpa, Dutse, and Dei-dei Abuja."></textarea>
        </fieldset>
        <button type="submit">Submit Poll</button>
      </form>
    </main>
    <footer>
      <P>
        &copy;2025 | HTML Form - User Poll Survey  | Solomon Obi
      </P>
    </footer>
 
  </body>
 
</html>
